<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <!-- The manifest link is injected by vite-plugin-pwa (see vite.config.ts). -->
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xenia Nessuvia: local-first character chat app</title>

    <!-- Search and link previews. Static because crawlers don't run JS: everything past this
         point in the DOM is an empty #root until React mounts, so these tags plus /about.html
         are the whole of what a crawler sees. -->
    <meta
      name="description"
      content="A browser-based character chat app. Chat with character cards, write longer stories, and host multiplayer sessions. Data stays in your browser and there are no accounts."
    />
    <link rel="canonical" href="https://xenia.nessuvia.com/" />


    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Xenia Nessuvia" />
    <meta property="og:title" content="Xenia Nessuvia" />
    <meta property="og:description" content="Xenia (ξενία, zenee-a) - the ancient Greek concept of hospitality; &quot;guest-friendship,&quot; rooted in generosity and reciprocity | Xenia Nessuvia - a local-first character app" />
    <meta property="og:url" content="https://xenia.nessuvia.com/" />
    <meta property="og:image" content="https://xenia.nessuvia.com/android-chrome-512x512.png" />

    <!-- The OS chrome before any of the app has run: the Default palette's background, rewritten
         from the active palette by core/palette/themeColor.ts once React mounts. The two capable
         tags are what make the iOS status bar style apply at all; Chrome wants the unprefixed one
         and iOS still reads its own. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#101014" />
  </head>
  <body>
    <div id="root"></div>
    <!-- The only link into /about.html that exists in static HTML, so a crawler can reach it
         from the root. React never touches this node. -->
    <noscript><a href="/about.html">About Xenia Nessuvia</a></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
